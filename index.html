<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Built by scripts/build_favicons.py from resources/icon.png, the same
         master @capacitor/assets builds the store icons from. This was
         `/vite.svg` from the day the project was scaffolded, so every tab and
         bookmark showed Vite's logo instead of the app's. apple-touch-icon is
         what iOS reads when the PWA is added to the home screen; without it
         Safari screenshots the page. It has to be PNG - iOS ignores WebP
         here, which is why the WebP manifest icons cannot cover this. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shot Caller - Muay Thai Shadow Boxing & Heavy Bag Timer App</title>
    <meta name="description" content="Shot Caller is a Muay Thai combo-calling app with an audio callout timer for shadow boxing and heavy bag training. Get randomized kickboxing combos, custom rounds, and voice-guided drills." />
    <meta name="keywords" content="muay thai app, shadow boxing app, heavy bag audio callout timer, kickboxing combo generator, boxing combo app, muay thai timer" />
    <!-- The app is served at /app; `/` is the marketing page. Both resolve to
         this same file on Netlify, so the canonical has to name the one that
         should rank, or the two compete. -->
    <link rel="canonical" href="https://shotcallernakmuay.netlify.app/app" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shot Caller - Muay Thai Shadow Boxing & Heavy Bag Timer App" />
    <meta property="og:description" content="Randomized Muay Thai combo callouts, custom interval timers, and voice-guided drills for shadow boxing and heavy bag training." />
    <meta property="og:url" content="https://shotcallernakmuay.netlify.app/app" />
    <!-- og-card.jpg, NOT hero_og.jpg. hero_og is the hero's background plate -
         a bare gradient with nothing on it - so every link preview the site
         ever produced was an empty purple wash with no logo or wordmark. The
         card is built by scripts/site-og-card.mjs; re-run it if the logo, the
         gradient or the tagline change. Dimensions are declared so a scraper
         can lay the preview out before it has finished fetching the image. -->
    <meta property="og:image" content="https://shotcallernakmuay.netlify.app/assets/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Shot Caller - Muay Thai Timer. Someone in your corner, calling the shots." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Twitter falls back to og:image, but only after failing to find this
         one; naming it explicitly is what keeps the card off the summary
         (small square) layout in clients that check for it first. -->
    <meta name="twitter:image" content="https://shotcallernakmuay.netlify.app/assets/og-card.jpg" />

    <!-- PWA. These tags used to live in public/index.html, which Vite's own
         root index.html shadowed - so the served page has never linked a
         manifest, `beforeinstallprompt` could never fire, and usePWA's
         `isPWAReady` check has always been false. Nobody has ever been able
         to install this. They belong here, on the file that actually ships. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#831843" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shot Caller" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-5GY5JTX5KZ"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-5GY5JTX5KZ");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
