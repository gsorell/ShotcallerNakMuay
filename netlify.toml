[build]
base = ""
command = "npm ci && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Routing
#
# `/` is the marketing page; the app lives at `/app`. Both are served from the
# same deploy: `home.html` is copied out of public/ verbatim, and `index.html`
# is the Vite-built SPA.
#
# The order below matters, and so does `force`. Netlify skips a rewrite when a
# real file already sits at the requested path, which is exactly why the SPA
# fallback has never swallowed `/blog/`. But that same rule would skip the
# root rewrite too, because `dist/index.html` genuinely exists — so the root
# rule is the one place that has to opt out of it.
#
# `index.html` stays where it is on purpose: Capacitor's `webDir` is `dist`
# and the native shells load `dist/index.html` directly, so moving the built
# entry point would break the iOS and Android builds for no gain.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Deep-link domain verification
#
# Apple and Google both fetch a file under /.well-known/ to decide whether this
# site is allowed to open the native apps. Neither request comes from a browser
# and neither follows a redirect, so these files have to be served as plain
# 200s from the real path — which they are, because the SPA fallback at the
# bottom is unforced and a real file always wins.
#
# apple-app-site-association has no file extension, so Netlify would otherwise
# serve it as application/octet-stream and Apple's CDN would reject it. That is
# the whole reason for the header block below.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

# ---------------------------------------------------------------------------
# Old host -> shotcallermuaythai.app, for the marketing pages only.
#
# The site's primary domain moved off the netlify.app subdomain, but three
# things have to keep answering on the old host, so this is a list and not a
# blanket `/*`:
#
#   /.well-known/*  installed apps verify share links against the old host,
#                   and neither store's verifier follows a redirect.
#   /s/*            the share links themselves (see SHARE_ORIGIN).
#   /app            browser storage is per-origin; redirecting the web app
#                   would hand every existing web user an empty one.
#
# These sit above the root rewrite because the first match wins.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://shotcallernakmuay.netlify.app/"
  to = "https://shotcallermuaythai.app/"
  status = 301
  force = true

[[redirects]]
  from = "https://shotcallernakmuay.netlify.app/home.html"
  to = "https://shotcallermuaythai.app/"
  status = 301
  force = true

[[redirects]]
  from = "https://shotcallernakmuay.netlify.app/blog/*"
  to = "https://shotcallermuaythai.app/blog/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://shotcallernakmuay.netlify.app/privacy-policy"
  to = "https://shotcallermuaythai.app/privacy-policy"
  status = 301
  force = true

[[redirects]]
  from = "https://shotcallernakmuay.netlify.app/privacy-policy.html"
  to = "https://shotcallermuaythai.app/privacy-policy.html"
  status = 301
  force = true

[[redirects]]
  from = "https://shotcallernakmuay.netlify.app/terms"
  to = "https://shotcallermuaythai.app/terms"
  status = 301
  force = true

[[redirects]]
  from = "https://shotcallernakmuay.netlify.app/terms.html"
  to = "https://shotcallermuaythai.app/terms.html"
  status = 301
  force = true

# Root -> the sales page. Forced, because a file exists at `/`.
[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200
  force = true

# The app, and anything under it.
[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

# SPA fallback. Kept last and unforced so every real file — /blog/*,
# /home.html, /assets/*, the policy pages — is served before it applies. This
# is also what keeps old inbound links to deep paths landing in the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
